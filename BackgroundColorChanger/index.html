<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
</head>
<body style="background-color: black; height:100vh;  margin:0; display:flex; justify-content: center;">
    <div id="root" style=" display:flex; flex-direction: row; align-items: center;">
        <button id="red" style="background-color: red; height:100px; width:100px; ">Red</button>
        <button id="blue" style="background-color: blue; height:100px; width:100px; ">blue</button>
        <button id="orange" style="background-color: orange; height:100px; width:100px; ">orange</button>
        <button id="green" style="background-color: green; height:100px; width:100px; ">green</button>
        <button id="pink" style="background-color: pink; height:100px; width:100px; ">pink</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
